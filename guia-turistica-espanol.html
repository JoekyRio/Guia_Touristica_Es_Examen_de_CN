<script>
// ===== 常量与状态 =====
const NB_KEY = 'guia_es_notebook_v2';
const TR_KEY = 'guia_es_translations_v2';
let currentTab = 'guiones';
let currentView = null;            // {mode:'guion'|'pregunta', ...}
let notebook = loadNotebook();
let translations = loadTranslations();
let currentSelection = null;       // {text, context, source}
let pendingText = '';              // 供语法选择器使用
let saving = false;

// ===== 工具函数 =====
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }

// ===== 笔记本本地持久化 =====
function loadNotebook() {
  try { const s = localStorage.getItem(NB_KEY); if (s) { const o = JSON.parse(s); if (o && o.items) return o; } } catch(e) {}
  return { items: [], deletedIds: [], updatedAt: 0 };
}
function persistNotebook() { notebook.updatedAt = Date.now(); localStorage.setItem(NB_KEY, JSON.stringify(notebook)); }
function loadTranslations() { try { const s = localStorage.getItem(TR_KEY); if (s) return JSON.parse(s); } catch(e) {} return {}; }
function persistTranslations() { localStorage.setItem(TR_KEY, JSON.stringify(translations)); }

// ===== Supabase 云同步（REST，无需 SDK）=====
function supabaseEnabled() { return typeof SUPABASE_CONFIG !== 'undefined' && SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey; }
function sbHeaders() {
  return { 'apikey': SUPABASE_CONFIG.anonKey, 'Authorization': 'Bearer ' + SUPABASE_CONFIG.anonKey, 'Content-Type': 'application/json' };
}
async function cloudRead() {
  const url = SUPABASE_CONFIG.url + '/rest/v1/notebook_store?id=eq.default&select=data';
  const res = await fetch(url, { headers: sbHeaders() });
  if (!res.ok) throw new Error('cloudRead ' + res.status);
  const arr = await res.json();
  return (arr && arr.length) ? (arr[0].data || null) : null;
}
async function cloudWrite(payload) {
  const url = SUPABASE_CONFIG.url + '/rest/v1/notebook_store';
  const res = await fetch(url, {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), { 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ id: 'default', data: payload }])
  });
  if (!res.ok) throw new Error('cloudWrite ' + res.status);
}
function mergeNotebooks(a, b) {
  const deleted = new Set([].concat(a.deletedIds || [], b.deletedIds || []));
  const map = new Map();
  [].concat(a.items || [], b.items || []).forEach(it => {
    if (deleted.has(it.id)) return;
    const prev = map.get(it.id);
    if (!prev || (it.updated || 0) > (prev.updated || 0)) map.set(it.id, it);
  });
  return { items: Array.from(map.values()), deletedIds: Array.from(deleted), updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0) };
}
async function syncNow() {
  persistNotebook();
  if (!supabaseEnabled()) return;
  try { await cloudWrite(notebook); } catch(e) { console.warn('云同步失败', e); }
}
async function initSync() {
  if (!supabaseEnabled()) { renderNotebook(); updateProgress(); return; }
  try {
    const cloud = await cloudRead();
    if (cloud && cloud.items) {
      notebook = mergeNotebooks(notebook, cloud);
      persistNotebook();
      await cloudWrite(notebook);
    } else {
      await cloudWrite(notebook);
    }
  } catch(e) { console.warn('云同步失败，使用本地数据', e); }
  renderNotebook(); updateProgress();
}

function hasCapture(text) {
  const t = text.toLowerCase();
  return notebook.items.some(it => it.text && t.includes(it.text.toLowerCase()));
}

function loadGuion(spotId, vIdx, highlightPara) {
  currentTab = 'guiones';
  const spot = guionesData.scenic_spots.find(s => s.id === spotId);
  if (!spot) return;
  const ver = spot.versions[vIdx];
  currentView = { mode: 'guion', spotId, versionIdx: vIdx };

  document.getElementById('contentTitle').textContent = spot.name_es;
  document.getElementById('contentSubtitle').textContent = `${ver.version} · ${ver.paragraphs.length} 段`;

  let html = '';
  ver.paragraphs.forEach((p, i) => {
    const mark = hasCapture(p.es) ? ' has-annotation' : '';
    html += `<div class="paragraph${mark}" data-idx="${i}">
      <span class="para-idx">§${i+1}</span>
      <span class="es">${p.es}</span>
      <span class="cn-original">${p.cn}</span>
    </div>`;
  });
  document.getElementById('textBlock').innerHTML = html;
  highlightSidebar('guion', spotId, vIdx);

      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); }

function loadPregunta(catIdx, qIdx) {
  currentTab = 'preguntas';
  const cat = preguntasData.categories[catIdx];
  if (!cat) return;
  const q = cat.questions[qIdx];
  if (!q) return;
  currentView = { mode: 'pregunta', catIdx, qIdx };

  document.getElementById('contentTitle').textContent = `Pregunta #${q.id}`;
  document.getElementById('contentSubtitle').textContent = cat.name_es;

function toggleQA(block) {

// ===== 选中文本 → 弹出选项 =====
document.addEventListener('mouseup', handleSelection);
document.addEventListener('touchend', handleSelection);

function handleSelection(e) {
  setTimeout(() => {
    if (e.target && e.target.id === 'selPopup' || (e.target && e.target.closest && e.target.closest('#selPopup'))) return;
    if (e.target && e.target.closest && e.target.closest('#modalOverlay')) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) { hidePopup(); return; }
    const text = sel.toString().replace(/\s+/g, ' ').trim();
    if (!text || text.length > 120) { hidePopup(); return; }
    const anchor = sel.anchorNode;
    const container = document.getElementById('textBlock');
    if (!container.contains(anchor)) { hidePopup(); return; }

    const blockEl = anchor.parentElement ? anchor.parentElement.closest('.paragraph, .qa-q, .qa-a') : null;
    const esEl = blockEl ? blockEl.querySelector('.es') : null;
    const context = esEl ? esEl.textContent.trim() : '';

    currentSelection = { text, context, source: getSourceFromAnchor(anchor) };
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    showPopup(rect);
  }, 15);
}

function getSourceFromAnchor(anchor) {
  const parent = anchor.parentElement || anchor;
  const para = parent.closest('.paragraph');
  if (para && currentView && currentView.mode === 'guion') {
    return { mode: 'guion', spotId: currentView.spotId, versionIdx: currentView.versionIdx, paraIdx: parseInt(para.dataset.idx) };
  }
  const qa = parent.closest('.qa-block');
  if (qa && currentView && currentView.mode === 'pregunta') {
    return { mode: 'pregunta', catIdx: currentView.catIdx, qIdx: parseInt(qa.dataset.idx) };
  }
  return null;
}

function showPopup(rect) {
  const popup = document.getElementById('selPopup');
  popup.style.display = 'block';
  const pw = popup.offsetWidth || 200;
  const ph = popup.offsetHeight || 36;
  let left = rect.left + rect.width / 2 - pw / 2;
  let top = rect.top - ph - 8;
  if (top < 60) top = rect.bottom + 8;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  top = Math.max(60, Math.min(top, window.innerHeight - ph - 8));
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}
function hidePopup() { document.getElementById('selPopup').style.display = 'none'; }

// ===== 翻译（在线 + 缓存）=====
async function translateText(text) {
  const key = text.toLowerCase().trim();
  if (translations[key]) return translations[key];
  if (navigator.onLine === false) return '';

  try {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=es|zh-CN';
    const res = await fetch(url);
    const json = await res.json();
    let meaning = (json.responseData && json.responseData.translatedText) || '';
    // 优先取神经机器翻译条目，避免语料库里的低质量匹配
    const mt = (json.matches || []).find(m => m['created-by'] === 'MT!');
    if (mt && mt.translation) meaning = mt.translation;
    meaning = String(meaning).trim();
    translations[key] = meaning;
    persistTranslations();
    return meaning;
  } catch (e) {
    console.warn('翻译失败', e);
    return '';
  }
}

function addItem(o) {
  const now = Date.now();
  const item = { id: uid(), type: o.type, text: o.text, meaning: o.meaning || '', note: o.note || '', grammarTitle: o.grammarTitle || '', examples: o.examples || [], context: o.context || '', source: o.source || null, created: now, updated: now };
  notebook.items.unshift(item);
  notebook.deletedIds = (notebook.deletedIds || []).filter(id => id !== item.id);
  persistNotebook();
  renderNotebook();
  updateProgress();
  syncNow();
  showSave('已加入笔记本');
}

function deleteItem(id) {
  if (!confirm('删除这条知识点？')) return;
  notebook.items = notebook.items.filter(it => it.id !== id);
  notebook.deletedIds = (notebook.deletedIds || []).concat(id);
  persistNotebook();
  syncNow();
  renderNotebook();
  updateProgress();
  refreshCurrentView();
  showSave('已删除');
}

// ===== 渲染笔记本 =====
const TYPE_LABEL = { vocab: '词汇', phrase: '短语', grammar: '语法' };
const TYPE_COLOR = { vocab: 'vocab', phrase: 'phrase', grammar: 'grammar' };
const TYPE_ORDER = ['vocab', 'phrase', 'grammar'];

function renderNotebook() {
  const body = document.getElementById('notebookBody');
  const countEl = document.getElementById('nbCount');
  const filter = (document.getElementById('nbFilter').value || '').toLowerCase().trim();

  let items = notebook.items;
  if (filter) {
    items = items.filter(it =>
      (it.text && it.text.toLowerCase().includes(filter)) ||
      (it.meaning && it.meaning.toLowerCase().includes(filter)) ||
      (it.grammarTitle && it.grammarTitle.toLowerCase().includes(filter)) ||
      (it.note && it.note.toLowerCase().includes(filter)));
  }

  countEl.textContent = `${notebook.items.length} 条`;

  if (items.length === 0) {
    body.innerHTML = filter
      ? '<div class="nb-empty"><div class="icon">🔍</div><p>没有匹配的知识点</p></div>'
      : `<div class="nb-empty"><div class="icon">📝</div><p>笔记本是空的</p><p style="font-size:0.75rem;margin-top:6px">在教材中选中不认识的词语/短语，<br>再选择「词汇 / 短语 / 语法」加入</p></div>`;
    return;
  }

  let html = '';
  TYPE_ORDER.forEach(type => {
    const group = items.filter(it => it.type === type);
    if (!group.length) return;
    html += `<div class="nb-group"><div class="nb-group-title ${TYPE_COLOR[type]}">${TYPE_LABEL[type]} <span class="cnt">· ${group.length}</span></div>`;
    group.forEach(it => { html += renderCard(it); });
    html += '</div>';
  });
  body.innerHTML = html;
}

function renderCard(it) {
  let examples = '';
  if (it.examples && it.examples.length) {
    examples = '<div class="nb-examples">';
    it.examples.forEach(ex => { examples += `<div>${escapeHtml(ex.es)} — ${escapeHtml(ex.zh)}</div>`; });
    examples += '</div>';
  }
  const tag = `<span class="type-chip chip-${TYPE_COLOR[it.type]}" style="font-size:0.6rem;padding:1px 8px;margin:0">${TYPE_LABEL[it.type]}</span>`;
  const title = it.grammarTitle ? `<span style="color:var(--accent);font-weight:700">${escapeHtml(it.grammarTitle)}</span> ` : '';
  const note = it.note ? `<div class="nb-extra">✏️ ${escapeHtml(it.note)}</div>` : '';
  const context = it.context ? `<span class="nb-context" title="${escapeHtml(it.context)}">${escapeHtml(truncate(it.context, 60))}</span>` : '<span></span>';

  return `<div class="nb-card type-${TYPE_COLOR[it.type]}" id="card-${it.id}">
    <div>${tag} <span class="nb-text">${escapeHtml(it.text)}</span></div>
    <div class="nb-meaning">${title}${escapeHtml(it.meaning)}</div>
    ${note}${examples}
    <div class="nb-meta">${context}
      <span class="nb-actions">
        ${it.source ? `<button onclick="jumpToSource('${it.id}')">原文</button>` : ''}
        <button class="del" onclick="deleteItem('${it.id}')">删除</button>
      </span>
    </div>
  </div>`;
}

function jumpToSource(id) {
  const it = notebook.items.find(x => x.id === id);
  if (!it || !it.source) return;
  const s = it.source;
  if (s.mode === 'guion') loadGuion(s.spotId, s.versionIdx, s.paraIdx);
  else if (s.mode === 'pregunta') { loadPregunta(s.catIdx, s.qIdx); }
  closeNotebookIfMobile();
}

function refreshCurrentView() {
  if (currentView && currentView.mode === 'guion') loadGuion(currentView.spotId, currentView.versionIdx);
  else if (currentView && currentView.mode === 'pregunta') loadPregunta(currentView.catIdx, currentView.qIdx);
}

function exportNotebook() {
  const blob = new Blob([JSON.stringify(notebook, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cuaderno-espanol.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importNotebook(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (obj && obj.items) {
        notebook = mergeNotebooks(notebook, obj);
        persistNotebook();
        syncNow();
        renderNotebook();
        updateProgress();
        refreshCurrentView();
        showSave('已导入并合并');
      } else { showToast('文件格式不正确'); }
    } catch(err) { showToast('导入失败：无法解析'); }
  };
  reader.readAsText(file);
  document.getElementById('importFile').value = '';
}

// ===== 搜索教材 =====
function handleSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('sidebarContent');
  if (!query) { renderSidebar(); return; }
  let html = '';
  if (currentTab === 'guiones') {
    guionesData.scenic_spots.forEach((spot, idx) => {
      spot.versions.forEach((ver, vIdx) => {
        const all = ver.paragraphs.map(p => p.es + ' ' + p.cn).join(' ').toLowerCase();
        if (all.includes(query) || spot.name_es.toLowerCase().includes(query) || spot.name_cn.includes(query)) {
          html += `<div class="sidebar-item" data-spot="${spot.id}" data-version="${vIdx}" onclick="loadGuion('${spot.id}', ${vIdx})"><span class="idx">${idx+1}.${vIdx+1}</span><span>${spot.name_es} — ${ver.version}</span></div>`;
        }
      });
    });
  } else {
    preguntasData.categories.forEach((cat, idx) => {
      cat.questions.forEach((q, qIdx) => {
        const all = (q.q_es + ' ' + q.a_es + ' ' + q.q_cn + ' ' + q.a_cn).toLowerCase();
        if (all.includes(query) || cat.name_es.toLowerCase().includes(query)) {
          html += `<div class="sidebar-item" data-cat="${idx}" data-q="${qIdx}" onclick="loadPregunta(${idx}, ${qIdx})"><span class="idx">${q.id}</span><span>${q.q_es.substring(0,46)}...</span></div>`;
        }
      });
    });
  }
  container.innerHTML = html || `<div class="nb-empty" style="padding:20px"><p>无结果："${escapeHtml(query)}"</p></div>`;
}

}
function closeNotebookIfMobile() { if (window.innerWidth <= 768) toggleNotebook(false); }

document.addEventListener('click', function(e) {
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && !e.target.closest('.mobile-toggle')) sidebar.classList.remove('open');
  }
  if (window.innerWidth <= 768 && e.target.id === 'notebookScrim') toggleNotebook(false);
});

// ===== 键盘 =====
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'f') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'Escape') { closeModal(); hidePopup(); }
});

// ===== 初始化 =====
renderSidebar();
updateProgress();
initSync();
console.log('📓 教材 + 笔记本模式已加载');
</script>
</body>
